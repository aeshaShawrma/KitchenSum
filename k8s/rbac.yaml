apiVersion: v1
kind: ServiceAccount
metadata:
  name: kitchensum-scaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kitchensum-scale-role
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [kitchensum-api]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kitchensum-scale-binding
subjects:
  - kind: ServiceAccount
    name: kitchensum-scaler
    namespace: default
roleRef:
  kind: Role
  name: kitchensum-scale-role
  apiGroup: rbac.authorization.k8s.io
